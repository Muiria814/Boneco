<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minerador de Passos DOGE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#1b255f,#050814);
  color:#fff;
  height:100vh;
  overflow:hidden;
}
.app{
  max-width:420px;
  margin:auto;
  padding:20px;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
.header{text-align:center;margin-bottom:15px}
.header h1{color:#f5b301;font-size:22px;font-weight:800}
.welcome{opacity:.85;font-size:14px;margin-top:5px}

.saldo-box{
  display:flex;justify-content:space-between;align-items:center;
  background:#0f1b3d;padding:16px;border-radius:16px;margin-bottom:20px
}
.saldo-box h2{margin:5px 0 0;color:#f5b301}

.gold-btn{
  background:linear-gradient(135deg,#f5b301,#ffd54f);
  border:none;border-radius:10px;padding:10px 14px;font-weight:700;
  cursor:pointer;
}
.main-btn{
  width:100%;padding:16px;margin:10px 0;border-radius:14px;
  border:none;font-size:16px;background:linear-gradient(135deg,#2a4fff,#1f6bff);
  color:#fff;cursor:pointer;
}
.logout-btn{
  width:100%;padding:16px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#e53935,#ff5252);color:#fff;cursor:pointer;
}
.center-buttons{
  margin-top:auto;
  margin-bottom:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.logout-text{
  margin-top:auto;
  text-align:center;
  opacity:.7;
  font-size:14px;
  cursor:pointer;
  padding:20px 0;
}

/* MODAL TELA CHEIA */
.modal{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#1b255f,#050814);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
  overflow-y:auto;
}
.hidden{display:none !important}
.modal-box{
  background:#0f1b3d;
  padding:25px 20px;
  border-radius:24px;
  width:100%;
  max-width:400px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.address{
  background:#060b24;border:1px solid #f5b301;
  padding:10px;border-radius:10px;font-size:13px;
  word-break:break-all;margin:10px 0;cursor:pointer
}

/* ROLETA - TAMANHO SUPER GRANDE */
.modal-box.roulette-box{
  max-width:500px;
  padding:30px 20px;
}

.wheel-wrapper{
  position:relative;
  width:350px;
  height:350px;
  margin:0 auto 30px;
}
.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:10px solid #f5b301;
  background:conic-gradient(
    #ff9800 0deg 45deg,
    #f44336 45deg 90deg,
    #4caf50 90deg 135deg,
    #03a9f4 135deg 180deg,
    #9c27b0 180deg 225deg,
    #2196f3 225deg 270deg,
    #8bc34a 270deg 315deg,
    #ffc107 315deg 360deg
  );
  transition:transform 7s cubic-bezier(0.1, 0.6, 0.2, 1);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 30px rgba(245,179,1,0.6);
}

/* EIXO CENTRAL - PARAFUSO/PORCA */
.wheel-center{
  position:absolute;
  width:50px;
  height:50px;
  background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
  border-radius:50%;
  z-index:40;
  box-shadow: 
    0 0 0 4px #0f1b3d,
    0 0 0 8px #f5b301,
    0 0 20px rgba(0,0,0,0.8),
    inset 0 -5px 10px rgba(0,0,0,0.6),
    inset 0 5px 15px rgba(255,255,255,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #fff8e7;
}

/* Detalhe do parafuso */
.wheel-center::before{
  content: "⚙️";
  position:absolute;
  font-size:28px;
  color:#fff;
  text-shadow:2px 2px 4px #000;
  opacity:0.9;
}

/* Anel interno do eixo */
.wheel-center::after{
  content: "";
  position:absolute;
  width:20px;
  height:20px;
  background: radial-gradient(circle, #333, #111);
  border-radius:50%;
  border:2px solid #aaa;
  box-shadow:inset 0 0 5px #000;
}

/* SETA FIXA EM BAIXO - MAIOR */
.pointer{
  position:absolute;
  bottom:-18px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:30px solid #fff;
  z-index:50;
  filter:drop-shadow(0 0 10px rgba(255,255,255,0.8));
}

/* MULTIPLICADORES - SEM SOMBRA, TEXTO PURO */
.wheel-labels{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
}
.wheel-labels span{
  position:absolute;
  color:white;
  font-weight:900;
  font-size:28px;
  text-shadow:none;
  background:transparent;
  padding:0;
  border:none;
  transform-origin:center center;
  letter-spacing:2px;
}

/* POSIÇÃO EXATA NO MEIO DE CADA TRIÂNGULO */
.multiplier-0{ transform: rotate(22.5deg) translate(0, -110px) rotate(-22.5deg); } /* 1.5x */
.multiplier-1{ transform: rotate(67.5deg) translate(0, -110px) rotate(-67.5deg); } /* 0.2x */
.multiplier-2{ transform: rotate(112.5deg) translate(0, -110px) rotate(-112.5deg); } /* 1x */
.multiplier-3{ transform: rotate(157.5deg) translate(0, -110px) rotate(-157.5deg); } /* 0.5x */
.multiplier-4{ transform: rotate(202.5deg) translate(0, -110px) rotate(-202.5deg); } /* 1.7x */
.multiplier-5{ transform: rotate(247.5deg) translate(0, -110px) rotate(-247.5deg); } /* 0.7x */
.multiplier-6{ transform: rotate(292.5deg) translate(0, -110px) rotate(-292.5deg); } /* 2x */
.multiplier-7{ transform: rotate(337.5deg) translate(0, -110px) rotate(-337.5deg); } /* 1.2x */

input{
  width:100%;
  padding:18px;
  border-radius:16px;
  border:none;
  margin-bottom:25px;
  font-size:20px;
  background:#060b24;
  color:#fff;
  border:2px solid #f5b301;
}
input::placeholder{color:#aaa;font-size:18px;}

.message{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:18px 28px;
  border-radius:50px;
  font-size:18px;
  z-index:2000;
  font-weight:bold;
  box-shadow:0 15px 30px rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.4);
  white-space:nowrap;
}
.success{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.error{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}

.mining-active {
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0px #f5b301; }
  50% { transform: scale(1.05); box-shadow: 0 0 40px #f5b301; }
  100% { transform: scale(1); box-shadow: 0 0 0px #f5b301; }
}

.mining-box{
  min-height:500px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.steps-counter{
  font-size:48px;
  font-weight:800;
  color:#f5b301;
  margin:20px 0;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    🐕
    <h1>MINERADOR DE PASSOS DOGE</h1>
    <div class="welcome">Bem-vindo! Mina passos e multiplica os teus DOGE 🚀</div>
  </div>

  <div class="saldo-box">
    <div>
      <small>SALDO DOGE</small>
      <h2 id="balance">0.00</h2>
    </div>
    <button class="gold-btn" onclick="openDeposit()">Depositar</button>
    <button class="gold-btn" onclick="openWithdraw()">Levantar</button>
  </div>

 <div class="center-buttons">
  <button class="main-btn" onclick="openMining()">⛏️ MINERAÇÃO DE PASSOS</button>
  <button class="main-btn" onclick="openRoulette()">🎲 JOGO DE ROLETA</button>
</div>

<div class="logout-text" onclick="logout()">⏻ TERMINAR SESSÃO</div>

<!-- MINERAÇÃO TELA CHEIA -->
<div id="miningModal" class="modal hidden">
  <div class="modal-box mining-box">
    <h2 style="color:#f5b301; margin-bottom:30px;">⛏️ MINERADOR DE PASSOS</h2>
    
    <div style="background:#050814; padding:20px; border-radius:20px; margin-bottom:20px;">
      <div style="font-size:18px; opacity:0.9;">TEMPO RESTANTE</div>
      <div style="font-size:48px; font-weight:800; color:#f5b301; margin:10px 0;" id="time">60:00</div>
    </div>
    
    <div style="background:#050814; padding:20px; border-radius:20px; margin-bottom:30px;">
      <div style="font-size:18px; opacity:0.9;">PASSOS MINERADOS</div>
      <div class="steps-counter" id="steps">0</div>
    </div>
    
    <p id="miningStatus" style="font-size:16px; margin-bottom:15px; color:#ffd54f;"></p>
    
    <button id="startMiningBtn" class="main-btn" onclick="startMining()" style="margin-top:10px;">Iniciar Mineração</button>
    <button class="logout-btn" onclick="closeMining()" style="margin-top:10px;">Fechar</button>
  </div>
</div>

<!-- DEPÓSITO -->
<div id="depositModal" class="modal hidden">
  <div class="modal-box">
    <h2 style="color:#f5b301;">Depositar DOGE</h2>
    <p style="margin:20px 0;">Envia DOGE para:</p>
    <div class="address" onclick="copyAddress()">DRgNGmH2udV4CzdVqANYFNDWPLZaXAjJ5N</div>
    <p style="margin:15px 0;">Mínimo: 1 DOGE</p>
    <button class="main-btn" onclick="closeDeposit()">Fechar</button>
  </div>
</div>

<!-- LEVANTAR -->
<div id="withdrawModal" class="modal hidden">
  <div class="modal-box">
    <h2 style="color:#f5b301;">Levantar DOGE</h2>
    <input id="withdrawValue" type="number" placeholder="5 a 10 DOGE" min="5" max="10" step="0.1">
    <button class="main-btn" onclick="withdraw()">Confirmar</button>
    <button class="logout-btn" onclick="closeWithdraw()">Cancelar</button>
  </div>
</div>

<!-- ROLETA SUPER GRANDE COM EIXO CENTRAL -->
<div id="rouletteModal" class="modal hidden">
  <div class="modal-box roulette-box">
    <h2 style="color:#f5b301; margin-bottom:25px; font-size:32px;">🎲 ROLETA DOGE</h2>
    
    <div class="wheel-wrapper">
      <!-- SETA EM BAIXO, FIXA -->
      <div class="pointer"></div>
      
      <!-- RODA QUE GIRA LENTAMENTE -->
      <div id="wheel" class="wheel">
        <div class="wheel-labels" id="wheelLabels"></div>
        <!-- EIXO CENTRAL - FIXO, NÃO GIRA -->
        <div class="wheel-center"></div>
      </div>
    </div>
    
    <input id="bet" type="number" placeholder="VALOR DA APOSTA (0.5 - 5 DOGE)" step="0.1" min="0.5" max="5">
    
    <button class="main-btn" onclick="spin()" style="margin-top:10px; font-size:20px; padding:18px;">🎰 GIRAR ROLETA</button>
    <button class="logout-btn" onclick="closeRoulette()" style="font-size:18px; padding:16px;">Fechar</button>
  </div>
</div>

<div id="msg" class="message hidden"></div>

<script>
let balance = Number(localStorage.getItem("balance")) || 0;
let steps = Number(localStorage.getItem("steps")) || 0;
let miningStart = localStorage.getItem("miningStart");
let mining = false;
let isSpinning = false;

// ORDEM DOS MULTIPLICADORES
const multipliers = [1.5, 0.2, 1, 0.5, 1.7, 0.7, 2, 1.2];

function updateUI(){
  document.getElementById("balance").innerText = balance.toFixed(2);
  document.getElementById("steps").innerText = steps;
  localStorage.setItem("balance", balance);
  localStorage.setItem("steps", steps);
}

function msg(t, type){
  const m = document.getElementById("msg");
  m.innerText = t;
  m.className = "message " + type;
  m.classList.remove("hidden");
  setTimeout(() => m.classList.add("hidden"), 4500);
}

/* MINERAÇÃO */
function openMining(){
  document.getElementById("miningModal").classList.remove("hidden");
  if(miningStart){
    document.getElementById("miningStatus").innerText = "⛏️ MINERANDO...";
  }
}
function closeMining(){
  document.getElementById("miningModal").classList.add("hidden");
}

function startMining(){
  if(mining) {
    msg("Mineração já está em andamento!", "error");
    return;
  }
  
  mining = true;
  miningStart = Date.now();
  localStorage.setItem("miningStart", miningStart);
  
  const btn = document.getElementById("startMiningBtn");
  btn.innerText = "⛏️ MINERANDO...";
  btn.classList.add("mining-active");
  document.getElementById("miningStatus").innerText = "⛏️ MINERANDO...";
  msg("Mineração iniciada! Ganhe passos a cada segundo.", "success");
}

// Intervalo da mineração
setInterval(() => {
  if(!miningStart) return;
  
  const elapsed = Math.floor((Date.now() - Number(miningStart)) / 1000);
  let remaining = 3600 - elapsed;
  
  if(remaining <= 0){
    remaining = 0;
    mining = false;
    miningStart = null;
    localStorage.removeItem("miningStart");
    
    document.getElementById("time").innerText = "00:00";
    document.getElementById("miningStatus").innerText = "✅ Mineração concluída!";
    
    const btn = document.getElementById("startMiningBtn");
    if(btn) {
      btn.innerText = "Iniciar Mineração";
      btn.classList.remove("mining-active");
    }
    return;
  }
  
  steps += 1000;
  
  if(steps >= 1000){
    let earned = Math.floor(steps / 1000);
    balance += earned;
    steps = steps % 1000;
  }
  
  let minutes = Math.floor(remaining / 60);
  let seconds = remaining % 60;
  
  const timeEl = document.getElementById("time");
  if(timeEl) timeEl.innerText = `${minutes}:${String(seconds).padStart(2,"0")}`;
  
  updateUI();
}, 1000);

/* DEPÓSITO */
function openDeposit(){depositModal.classList.remove("hidden")}
function closeDeposit(){depositModal.classList.add("hidden")}
function copyAddress(){
  navigator.clipboard.writeText("DRgNGmH2udV4CzdVqANYFNDWPLZaXAjJ5N");
  msg("Endereço copiado ✅","success");
}

/* LEVANTAR */
function openWithdraw(){withdrawModal.classList.remove("hidden")}
function closeWithdraw(){withdrawModal.classList.add("hidden")}
function withdraw(){
  const v = Number(document.getElementById("withdrawValue").value);
  if(v<5||v>10){msg("Levantamento entre 5 e 10 DOGE","error");return}
  if(v>balance){msg("Saldo insuficiente","error");return}
  balance -= v;
  updateUI();
  msg("Levantamento registado ✅","success");
  closeWithdraw();
}

/* ROLETA - SUPER LENTA E GRANDE COM EIXO */
function openRoulette(){
  rouletteModal.classList.remove("hidden");
  renderWheelLabels();
  
  const wheel = document.getElementById("wheel");
  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';
  void wheel.offsetHeight;
  wheel.style.transition = 'transform 7s cubic-bezier(0.1, 0.6, 0.2, 1)';
  
  document.getElementById("bet").value = "";
  isSpinning = false;
}

function closeRoulette(){
  rouletteModal.classList.add("hidden");
  isSpinning = false;
}

function renderWheelLabels(){
  const labelsContainer = document.getElementById("wheelLabels");
  labelsContainer.innerHTML = "";
  
  multipliers.forEach((mult, index) => {
    const span = document.createElement("span");
    span.innerText = mult.toFixed(1) + "x";
    span.className = "multiplier-" + index;
    labelsContainer.appendChild(span);
  });
}

function spin(){
  if(isSpinning) {
    msg("A roleta já está a girar! Aguarde...", "error");
    return;
  }
  
  const bet = Number(document.getElementById("bet").value);
  if(!bet || bet < 0.5 || bet > 5){
    msg("Aposta inválida (0.5 - 5 DOGE)", "error");
    return;
  }
  if(bet > balance){
    msg("Saldo insuficiente", "error");
    return;
  }
  
  // Deduz aposta
  balance -= bet;
  updateUI();
  
  isSpinning = true;
  
  // Sorteia o multiplicador
  const i = Math.floor(Math.random() * multipliers.length);
  const m = multipliers[i];
  const wheel = document.getElementById("wheel");
  
  // RESET
  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';
  void wheel.offsetHeight;
  
  // ATIVA GIRO LENTO - 7 SEGUNDOS
  wheel.style.transition = 'transform 7s cubic-bezier(0.1, 0.6, 0.2, 1)';
  
  // GIRA LENTAMENTE - 3 voltas apenas
  const targetDegrees = 22.5 + (i * 45);
  wheel.style.transform = `rotate(${360 * 3 + targetDegrees}deg)`;
  
  // MENSAGEM ÚNICA - SEMPRE POSITIVA
  setTimeout(() => {
    const ganho = Number((bet * m).toFixed(2));
    balance = Number((balance + ganho).toFixed(2));
    updateUI();
    
    msg(`🎉 PARABÉNS! 🎉 Ganhou ${ganho.toFixed(2)} DOGE`, "success");
    
    isSpinning = false;
  }, 7000);
}

// Logout
function logout(){
  balance = 0;
  steps = 0;
  mining = false;
  miningStart = null;
  localStorage.clear();
  updateUI();
  msg("Sessão terminada. Até breve!", "success");
}

// Inicializar
updateUI();
if(miningStart){
  mining = true;
  document.getElementById("miningStatus").innerText = "⛏️ MINERANDO...";
}

// Tecla Enter para girar roleta
document.addEventListener('keypress', function(e) {
  if(e.key === 'Enter' && !rouletteModal.classList.contains('hidden') && !isSpinning) {
    spin();
  }
});
</script>

</body>
</html>
