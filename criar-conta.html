<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Minerador de Passos Doge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset e configurações gerais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100dvh;
  padding: 12px;
}

.main-container {
  width: 100%;
  max-width: none;
}

.form-card {
  max-width: 700px;
  margin: 0 auto;
  padding: 18px;
}
    /* Cabeçalho */
    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo {
      color: #f1c40f;
      font-size: 2rem;
      margin-bottom: 4px;
    }

    .title {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 1rem;
      font-weight: 300;
    }

    /* Grupo de campos do formulário */
    .form-group {
      margin-bottom: 12px;
    }

    /* Labels */
    .form-label {
      display: block;
      color: #f1c40f;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 8px;
      margin-left: 5px;
    }

    /* Campos de entrada */
    .input-field {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: #f1c40f;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.2);
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Botão principal */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      color: #1a1a2e;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
      background: linear-gradient(135deg, #ffd32a, #f39c12);
    }

    .submit-btn:active {
      transform: translateY(-1px);
    }

    /* Links e seção de navegação */
    .navigation-section {
      text-align: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-prompt {
      color: #b8b8b8;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .login-link {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .back-link {
      display: block;
      color: #f1c40f;
      text-decoration: none;
      margin-top: 25px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .back-link:hover {
      color: #ffd32a;
      text-decoration: underline;
    }

    /* Mensagens de feedback */
    .message {
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      font-weight: 500;
      display: none;
    }

    .message.success {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
      display: block;
    }

    .message.error {
      background: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
      display: block;
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .form-card {
        padding: 30px 25px;
      }
      
      .title {
        font-size: 1.6rem;
      }
      
      .input-field {
        padding: 14px 18px;
      }
      
      .submit-btn {
        padding: 16px;
      }
    }

    /* Animações */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-card {
      animation: fadeIn 0.6s ease-out;
    }

    /* Ícone dentro do campo */
    .input-with-icon {
      position: relative;
    }

    .input-with-icon i {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
    }
    @media (max-height: 700px) {
  .header {
    margin-bottom: 12px;
  }
  
.form-card {
    padding: 18px;
  }
  
   .header {
    margin-bottom: 12px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .navigation-section {
    margin-top: 15px;
  }
}

@media (min-width: 768px) {
  body {
    padding: 32px;
  }

  .form-card {
    padding: 32px;
  }

  .form-group {
    margin-bottom: 16px;
  }
}

@media (min-width: 1024px) {
  .form-card {
    max-width: 520px;
    padding: 40px;
  }

  .title {
    font-size: 1.8rem;
  }

  .logo {
    font-size: 2.4rem;
  }
}
  </style>
</head>
<body>
  <div class="main-container">
    <div class="form-card">
      <!-- Cabeçalho -->
      <div class="header">
        <div class="logo">
          <i class="fas fa-dog"></i>
        </div>
        <h1 class="title">MINERADOR DE PASSOS DOGE</h1>
        <p class="subtitle">Crie sua conta gratuitamente</p>
      </div>

      <!-- Formulário de Registro -->
      <form id="registerForm">
        <div class="form-group">
          <label for="name" class="form-label">
            <i class="fas fa-user" style="margin-right: 8px;"></i>Nome do Utilizador
          </label>
          <input 
            type="text" 
            id="name" 
            class="input-field" 
            placeholder="Digite o nome do Utilizador"
            required
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">
            <i class="fas fa-envelope" style="margin-right: 8px;"></i>Endereço de Email
          </label>
          <input 
            type="email" 
            id="email" 
            class="input-field" 
            placeholder="Insira o seu email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            <i class="fas fa-lock" style="margin-right: 8px;"></i>Palavra-passe
          </label>
          <div class="input-with-icon">
            <input 
              type="password" 
              id="password" 
              class="input-field" 
              placeholder="Crie uma palavra-passe segura"
              required
            >
            <i class="fas fa-eye" id="togglePassword"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            <i class="fas fa-lock" style="margin-right: 8px;"></i>Confirmar Palavra-passe
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="input-field" 
            placeholder="Digite novamente sua palavra-passe"
            required
          >
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-user-plus"></i>
          Criar Conta
        </button>

        <div id="message" class="message"></div>
      </form>

      <!-- Navegação -->
      <div class="navigation-section">
        <p class="login-prompt">Já possui uma conta?</p>
        <a href="iniciar-sessao.html" class="login-link">
          <i class="fas fa-sign-in-alt"></i>
          Iniciar Sessão
        </a>
        
        <a href="index.html" class="back-link">
          <i class="fas fa-arrow-left"></i>
          Voltar à Página Inicial
        </a>
      </div>
    </div>
  </div>

  <script>
    // Mostrar/ocultar senha
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordField = document.getElementById('password');
      const icon = this;
      
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Validação do formulário
    document.getElementById('registerForm').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      
      // Limpar mensagem anterior
      messageDiv.textContent = '';
      messageDiv.className = 'message';
      
      // Validações
      if (!name || !email || !password || !confirmPassword) {
        showMessage('Por favor, preencha todos os campos.', 'error');
        return;
      }
      
      if (name.length < 3) {
        showMessage('O nome deve ter pelo menos 3 caracteres.', 'error');
        return;
      }
      
      if (!isValidEmail(email)) {
        showMessage('Por favor, insira um email válido.', 'error');
        return;
      }
      
      if (password.length < 6) {
        showMessage('A senha deve ter pelo menos 6 caracteres.', 'error');
        return;
      }
      
      if (password !== confirmPassword) {
        showMessage('As palavras-passe não coincidem.', 'error');
        return;
      }
      
      // Simular criação de conta (substituir por API real)
      showMessage('Conta criada com sucesso! Redirecionando...', 'success');
      
      // Salvar dados no localStorage (simulação)
      const userData = {
        name: name,
        email: email,
        password: password,
        steps: 0,
        energy: 100,
        doge: 0.00,
        createdAt: new Date().toISOString()
      };
      
      localStorage.setItem('dogeUser', JSON.stringify(userData));
      
      // Redirecionar após 2 segundos
      setTimeout(() => {
        window.location.href = 'app.html';
      }, 2000);
    });
    
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }
    
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }
    
    // Verificar se já está logado
    window.onload = function() {
      const savedUser = localStorage.getItem('dogeUser');
      if (savedUser) {
        // Se já tem conta, redirecionar para app
        window.location.href = 'app.html';
      }
    };
  </script>
</body>
</html>
