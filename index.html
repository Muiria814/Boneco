<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mini App - Contador de Passos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Mini App de Passos</h1>

  <div id="game">
    <div id="character"></div>
  </div>

  <p>Passos: <span id="steps">0</span></p>

  <button id="startBtn">Iniciar</button>
  <button id="resetBtn">Parar</button>
  <button id="convertBtn">Converter para DOGE</button>

  <p>DOGE: <span id="doge">0.00</span></p>
  
  <div id="withdraw-section" style="margin-top: 30px; display: flex; gap: 20px; align-items: center;">
  <input type="text" id="doge-address" placeholder="Digite seu endereço DOGE" style="flex: 1; padding: 10px; font-size: 25px;">
  <button id="withdraw-button" style="padding: 8px 16px; font-size: 16px;">Levantar</button>
</div>
<p id="withdraw-message" style="margin-top: 10px; color: green;"></p>

  <script src="script.js"></script>

</body>
</html>
