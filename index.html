<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MINERADOR DE PASSOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ====== LOGIN ====== -->
  <div id="login-screen" style="text-align:center; margin-top:100px;">
    <h2>Login</h2>
    <input
      type="password"
      id="passwordInput"
      placeholder="Palavra-passe"
      style="padding:35px; font-size:35px;"
    />
    <br><br>
    <button id="loginBtn" style="padding:30px 50px; font-size:40px;">
      Iniciar Sessão
    </button>
    <p id="loginMessage"></p>
  </div>

  <!-- ====== APP ====== -->
  <div id="app" style="display:none;">

    <h1>Mini App de Passos</h1>

    <div id="game">
      <div id="character"></div>
    </div>

    <p>Passos: <span id="steps">0</span></p>

    <button id="startBtn">Iniciar</button>
    <button id="resetBtn">Parar</button>
    <button id="convertBtn">Converter para DOGE</button>

    <p>DOGE: <span id="doge">0.00</span></p>

    <!-- ====== WITHDRAW DOGE ====== -->
    <div id="withdraw-section" style="margin-top: 40px; display: flex; flex-direction: column; gap: 15px;">
      <p>📌 Regra de conversão: 1000 passos = 1 DOGE</p>
      <input
        type="text"
        id="dogeAddress"
        placeholder="Digite seu endereço DOGE"
        style="padding: 15px; font-size: 30px;"
      >
      <input
        type="number"
        id="dogeAmount"
        placeholder="Quantidade DOGE"
        step="0.01"
        style="padding: 15px; font-size: 30px;"
      >
      <button
        onclick="withdrawDoge()"
        style="padding: 40px 22px; font-size: 40px;"
      >
        Levantar DOGE
      </button>
      <p id="withdraw-message" style="margin-top: 10px; color: green;"></p>
    </div>

    <!-- ====== LOGOUT ====== -->
    <button
      id="logoutBtn"
      style="
        margin-top: 30px;
        padding: 20px 30px;
        font-size: 35px;
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 15px;
      "
    >
      Terminar sessão
    </button>

  </div>

  <script src="script.js"></script>
</body>

</html>
