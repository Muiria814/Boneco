<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Minerador DOGE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Garante que o fundo ocupe 100% da altura, mesmo com pouco conteúdo */
        html, body {
            height: 100%;
            background-color: #0b0618;
        }

        body {
    min-height: 100dvh; /* viewport real no mobile */
    width: 100%;
    margin: 0;
    overflow-x: hidden;

    background: linear-gradient(135deg, #140a2a, #0b0618);
    background-repeat: no-repeat;
    background-size: cover;

    font-family: Arial, sans-serif;
    color: white;

    display: flex;
    flex-direction: column;
overscroll-behavior: none;
}

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 50px 35px;
            flex: 1; /* Empurra o rodapé para o fundo */
        }

        h1 {
            background: linear-gradient(45deg, #ffd700, #ffa500, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 56px;
            margin-bottom: 30px;
            text-align: center;
        }

        .welcome-message {
            color: #b0c4de;
            font-size: 16px;
            margin-bottom: 30px;
            font-style: italic;
            border-left: 8px solid #ffd700;
            padding-left: 35px;
            line-height: 1.8;
        }

        /* CARTÕES DE SEÇÃO */
        .card {
            background: #0f1b3d;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .saldo h2 {
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
            color: #fff;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .deposit { background: linear-gradient(135deg,#00c6ff,#0072ff); }
        .withdraw { background: linear-gradient(135deg,#2c3e50,#34495e); }

        /* INPUTS - CORREÇÃO DE ZOOM (Mínimo 16px) */
        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid gold;
            background: #0b0618;
            color: white;
            margin: 15px 0;
            font-size: 16px; /* Impede zoom no iOS/Android */
            outline: none;
            display: block;
        }

        .main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg,#2a4fff,#1f6bff);
            color: white;
        }

        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ROLETA */
        .wheel-wrapper {
            width: 300px;
            height: 300px;
            margin: 25px auto;
            position: relative;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid gold;
            transition: transform 7s cubic-bezier(0.1, 0.6, 0.2, 1);
            background: conic-gradient(
                #ff9800 0deg 45deg, #f44336 45deg 90deg,
                #4caf50 90deg 135deg, #03a9f4 135deg 180deg,
                #9c27b0 180deg 225deg, #2196f3 225deg 270deg,
                #8bc34a 270deg 315deg, #ffc107 315deg 360deg
            );
            position: relative;
        }

        /* Seta da roleta */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 10;
        }

        .wheel-labels span {
            position: absolute;
            left: 50%;
            top: 50%;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 10px;
            transform-origin: center;
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f1b3d;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 2px solid gold;
        }

        /* RODAPÉ */
        .terminar-sessao {
            width: 100%;
            background: rgba(11, 6, 24, 0.9);
            text-align: center;
            padding: 20px;
            font-size: 20px;
            color: #ff6b6b;
            cursor: pointer;
            border-top: 1px solid rgba(255,107,107,0.2);
        }

        #msg {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 30px;
            display: none;
            z-index: 3000;
            font-weight: bold;
            text-align: center;
            min-width: 250px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🐕 MINERADOR DOGE</h1>
    <div class="welcome-message">Minera e aposta as tuas DOGE com segurança e rapidez!</div>

    <div class="card saldo">
        <div style="font-size: 14px; color: #b0c4de;">Saldo Disponível</div>
        <h2 id="balance">0.00</h2>
        <div class="buttons">
            <button class="btn deposit" onclick="openDepositModal()">Depositar</button>
            <button class="btn withdraw" onclick="openWithdrawModal()">Levantar</button>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-bottom:15px;">⛏️ Mineração</h2>
        <p>Tempo restante: <span id="time" style="font-weight:bold; color: #00c6ff;">60:00</span></p>
        <p>Passos: <span id="steps" style="font-weight:bold; color: #ffd700;">0</span></p>
        <button id="mineBtn" class="main-btn" onclick="startMining()" style="margin-top:15px;">Iniciar Mineração</button>
    </div>

    <div class="card" style="text-align: center;">
        <h2 style="text-align: left; margin-bottom:10px;">🎲 Roleta DOGE</h2>
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div id="wheel" class="wheel">
                <div id="labels" class="wheel-labels"></div>
            </div>
        </div>
        <input type="number" id="betAmount" placeholder="Aposta (0.5 - 5 DOGE)" min="0.5" max="5" step="0.1">
        <button id="spinBtn" class="main-btn" onclick="spin()">GIRAR ROLETA</button>
    </div>
</div>

<div class="terminar-sessao" onclick="resetGame()">Terminar Sessão</div>

<div id="msg"></div>

<div id="depositModal" class="modal">
    <div class="modal-content">
        <h3>💰 DEPOSITAR DOGE</h3>
        <p style="color:#ffd700; margin: 15px 0 5px;">Endereço da Carteira:</p>
        <p style="background:#0b0618; padding:12px; border-radius:10px; border:1px solid gold; word-break:break-all; font-size: 13px;">
            DRgNGmH2udV4CzdVqANYFNDWPLZaXAjJ5N
        </p>
        <input id="depositAmount" type="number" placeholder="Valor enviado (min 1)">
        <div class="buttons">
            <button class="btn deposit" onclick="confirmDeposit()">Confirmar</button>
            <button class="btn withdraw" onclick="closeDepositModal()">Cancelar</button>
        </div>
    </div>
</div>

<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h3>💸 LEVANTAR DOGE</h3>
        <input id="withdrawAmount" type="number" placeholder="Valor (mínimo 10)">
        <input id="withdrawAddress" type="text" placeholder="Endereço DOGE">
        <div class="buttons">
            <button class="btn deposit" onclick="confirmWithdraw()">Confirmar</button>
            <button class="btn withdraw" onclick="closeWithdrawModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    let balance = Number(localStorage.getItem("balance")) || 0;
    let steps = 0;
    let mining = false;
    let isSpinning = false;
    let currentRotation = 0;
    const multipliers = [1.5, 0.2, 1.2, 0.5, 1.7, 0.7, 2, 1.2];

    function updateUI() {
        document.getElementById("balance").innerText = balance.toFixed(2);
        document.getElementById("steps").innerText = steps;
        localStorage.setItem("balance", balance);
    }

    function showMsg(text, isError = false) {
        const m = document.getElementById("msg");
        m.innerText = text;
        m.style.display = "block";
        m.style.background = isError ? "#e74c3c" : "#2ecc71";
        setTimeout(() => m.style.display = "none", 3000);
    }

    // Lógica de Modais
    function openDepositModal() { document.getElementById("depositModal").style.display = "flex"; }
    function closeDepositModal() { document.getElementById("depositModal").style.display = "none"; }
    function openWithdrawModal() { document.getElementById("withdrawModal").style.display = "flex"; }
    function closeWithdrawModal() { document.getElementById("withdrawModal").style.display = "none"; }

    function confirmDeposit() {
        const v = Number(document.getElementById("depositAmount").value);
        if(v < 1) return showMsg("Mínimo 1 DOGE", true);
        balance += v;
        updateUI();
        showMsg("Depósito solicitado!");
        closeDepositModal();
    }

    function confirmWithdraw() {
        const v = Number(document.getElementById("withdrawAmount").value);
        const addr = document.getElementById("withdrawAddress").value;
        if(v < 10 || v > balance || !addr) return showMsg("Dados inválidos ou saldo insuficiente", true);
        balance -= v;
        updateUI();
        showMsg("Levantamento em processamento!");
        closeWithdrawModal();
    }

    // Mineração
    function startMining() {
        if(mining) return;
        mining = true;
        const btn = document.getElementById("mineBtn");
        btn.disabled = true;
        btn.innerText = "⛏️ Minerando...";
        
        let timeLeft = 3600;
        const interval = setInterval(() => {
            timeLeft--;
            steps++;
            
            if(steps >= 1000) {
                balance += 1;
                steps = 0;
            }

            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById("time").innerText = `${m}:${String(s).padStart(2, '0')}`;
            updateUI();

            if(timeLeft <= 0) {
                clearInterval(interval);
                mining = false;
                btn.disabled = false;
                btn.innerText = "Iniciar Mineração";
            }
        }, 1000);
    }

    // Roleta
    function renderLabels() {
        const container = document.getElementById("labels");
        const radius = 115;
        multipliers.forEach((m, i) => {
            const span = document.createElement("span");
            span.innerText = m + "x";
            const angle = i * 45 + 22.5;
            const rad = angle * Math.PI / 180;
            const x = Math.cos(rad) * radius;
            const y = Math.sin(rad) * radius;
            span.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
            container.appendChild(span);
        });
    }
    renderLabels();

    function spin() {
        if(isSpinning) return;
        const bet = Number(document.getElementById("betAmount").value);
        if(bet < 0.5 || bet > 5 || bet > balance) return showMsg("Aposta inválida", true);

        balance -= bet;
        updateUI();
        isSpinning = true;
        document.getElementById("spinBtn").disabled = true;

        const index = Math.floor(Math.random() * 8);
        const extraDegrees = 1800; // 5 voltas
        const segmentDeg = 45;
        // Compensação para a seta estar no topo (270deg de offset dependendo da rotação)
        const targetDeg = (360 - (index * segmentDeg)) - 22.5; 
        
        currentRotation += extraDegrees + targetDeg + (360 - (currentRotation % 360));
        document.getElementById("wheel").style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            const win = bet * multipliers[index];
            balance += win;
            updateUI();
            showMsg(`Ganhou ${win.toFixed(2)} DOGE!`);
            isSpinning = false;
            document.getElementById("spinBtn").disabled = false;
        }, 7000);
    }

    function resetGame() {
        if(confirm("Deseja sair?")) {
            localStorage.clear();
            location.reload();
        }
    }

    updateUI();
</script>

</body>
</html>
