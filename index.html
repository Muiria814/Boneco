<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MINERADOR DE PASSOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ====== LOGIN ====== -->
  <div id="login-screen" style="text-align:center; margin-top:100px;">
    <h2>Login</h2>
    <input
      type="password"
      id="passwordInput"
      placeholder="Palavra-passe"
      style="padding:30px; font-size:45px;"
    />
    <br><br>
    <button id="loginBtn" style="padding:30px 20px; font-size:30px;">
      Entrar
    </button>
    <p id="loginMessage"></p>
  </div>

  <!-- ====== APP ====== -->
  <div id="app" style="display:none;">

    <h1>Mini App de Passos</h1>

   <div id="game">
      <div id="character"></div>
     
    </div>

    <p>Passos: <span id="steps">0</span></p>

    <button id="startBtn">Iniciar</button>
    <button id="resetBtn">Parar</button>
    <button id="convertBtn">Converter para DOGE</button>

    <p>DOGE: <span id="doge">0.00</span></p>

    <div id="withdraw-section" style="margin-top: 40px; display: flex; gap: 30px; align-items: center;">
      <input
        type="text"
        id="doge-address"
        placeholder="Digite seu endereço DOGE"
        style="flex: 1; padding: 15px; font-size: 30px;"
      >
      <button
        id="withdraw-button"
        style="padding: 40px 22px; font-size: 40px;"
      >
        Levantar
      </button>
    </div>

    <p id="withdraw-message" style="margin-top: 10px; color: green;"></p>
    
    <button
  id="logoutBtn"
  style="
    margin-top: 30px;
    padding: 20px 30px;
    font-size: 35px;
    background-color: #e74c3c;
    color: white;
    border: none;
    border-radius: 15px;
  "
>
  Terminar sessão
    </button>

  </div>

  <script src="script.js"></script>
</body>
</html>
