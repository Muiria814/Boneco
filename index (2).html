<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MINERADOR DE PASSOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== WELCOME ====== -->
<div id="welcome-screen" style="text-align:center; margin-top:100px;">
  <button id="goToRegister" 
          style="padding:30px 60px; font-size:35px; margin-bottom:25px;">
    Criar Conta
  </button>

  <h3>Já tem conta?</h3>

  <button id="goToLogin" 
          style="padding:20px 40px; font-size:25px;">
    Iniciar Sessão
  </button>
</div>

  <!-- ====== LOGIN ====== -->
<div id="login-screen" style="display:none; text-align:center; margin-top:80px;">
  <h2>Iniciar Sessão</h2>

  <input type="email" id="loginEmail" placeholder="Email" 
         style="padding:25px; font-size:28px; width:80%; max-width:400px;">
  <br><br>

  <input type="password" id="loginPassword" placeholder="Palavra-passe" 
         style="padding:25px; font-size:28px; width:80%; max-width:400px;">
  <br><br>

  <button id="loginBtn" style="padding:20px 40px; font-size:28px;">
    Entrar
  </button>

  <p id="loginMessage"></p>

  <br>
  <button id="backToWelcome" style="padding:15px 30px;">
    Voltar
  </button>
</div>
  
  <!-- ====== REGISTRO ====== -->
  <div id="register-screen" style="display:none; text-align:center; margin-top:50px;">
    <h2>Criar Conta</h2>
    <input type="text" id="registerName" placeholder="Nome" style="padding:20px; font-size:25px;">
    <input type="email" id="registerEmail" placeholder="Email" style="padding:20px; font-size:25px;">
    <input type="password" id="registerPassword" placeholder="Palavra-passe" style="padding:20px; font-size:25px;">
    <input type="password" id="registerPasswordConfirm" placeholder="Confirmar palavra-passe" style="padding:20px; font-size:25px;">
    <br>
    <button id="registerBtn" style="padding:30px 50px; font-size:35px;">Registrar</button>
    <p id="registerMessage"></p>
    <br>
    <button id="backToLogin" style="padding:20px 40px; font-size:25px;">Voltar ao Login</button>
  </div>

  <!-- ====== APP ====== -->
  <div id="app" style="display:none; text-align:center;">

    <h1>Mini App de Passos</h1>

    <!-- ====== PASSOS E ENERGIA ====== -->
    <p>Passos: <span id="steps">0</span></p>
    <p>Energia: <span id="energia">0</span></p>

    <!-- ====== BOTÕES DE MOVIMENTO / CONVERSÃO ====== -->
    <button id="startBtn" style="padding:30px 50px; font-size:35px;">Iniciar Caminhada</button>
    <button id="resetBtn" style="padding:30px 50px; font-size:35px;">Parar</button>
    <button id="convertBtn" style="padding:30px 50px; font-size:35px;">Converter para DOGE</button>
    
    <p id="convertMessage" style="font-size:35px; margin-top:10px;"></p>

    <!-- ====== SALDO DOGE ====== -->
    <p>DOGE: <span id="doge">0.00</span></p>

    <!-- ====== WITHDRAW DOGE ====== -->
<div id="withdraw-section" style="margin-top:40px; display:flex; flex-direction:column; gap:15px;">
  <p>📌 Regra de conversão: 1000 passos = 1 DOGE</p>
  <input type="text" id="dogeAddress" placeholder="Digite seu endereço DOGE" style="padding:15px; font-size:30px;">
  <button id="withdrawBtn" style="padding:40px 22px; font-size:40px;">Levantar DOGE</button>
  <p id="withdraw-message" style="margin-top:10px; color:green;"></p>
</div>

    <!-- ====== LOGOUT ====== -->
    <button id="logoutBtn" style="margin-top:30px; padding:20px 30px; font-size:35px; background-color:#e74c3c; color:white; border:none; border-radius:15px;">
      Terminar sessão
    </button>

  </div>

  <script src="script.js"></script>
</body>
</html>
